<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Formulieren</title><meta name="robots" content="noindex"></head>
<body>
<!-- Skelet voor Netlify Forms: velden moeten exact overeenkomen met src/components/testcenter.tsx en visit.tsx -->
<form name="racket-test" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="racket-test" />
  <input name="bot-field" />
  <input name="naam" type="text" />
  <input name="email" type="email" />
  <input name="dag" type="text" />
  <input name="tijd" type="text" />
  <select name="coach"><option value="any">any</option></select>
  <input type="hidden" name="subject" value="Nieuwe racket-test aangevraagd (%{submissionId})" />
</form>
<form name="nieuwsbrief" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="nieuwsbrief" />
  <input name="bot-field" />
  <input name="email" type="email" />
</form>
</body></html>
